services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      # Needed for HMR file watching on Windows/Mac bind mounts
      - CHOKIDAR_USEPOLLING=true
